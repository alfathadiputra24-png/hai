            .map((item) => {
              const p = getProduct(item.productId);
              if (!p) return "";
              const addonsText = (item.addons || []).map((a) => `${a.name} (×${a.qty})`).join(", ");
              const itemTotal =
                (p.price + (item.addons || []).reduce((s, a) => s + a.price * a.qty, 0)) * item.qty;
              return `
                <div class="cart-card" data-cart-key="${item.key}">

                      <span class="cart-price">${formatRp(itemTotal)}</span>
                      <div class="stepper">
                        <button class="step-btn" data-cart-dec="${item.key}" aria-label="Kurangi">−</button>
                        <span class="step-val">${item.qty}</span>
                        <button class="step-btn plus" data-cart-inc="${item.key}" aria-label="Tambah">+</button>

                    </svg>
                  </button>
                </div>

            .join("")}

        <div class="cart-cta-wrap">

        b.addEventListener("click", () => {

            if (state.cart[idx].qty > 1) state.cart[idx].qty -= 1;
            else state.cart.splice(idx, 1);
            saveCart();
            renderCartScreen();
          }

      });

            isRegister

              <path fill="#EA4335" d="M12 5c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.09 14.97 0 12 0 7.31 0 3.25 2.69 1.25 6.6l3.66 2.84C5.77 6.86 8.63 5 12 5z"/>
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.7 2.87c2.16-2 3.72-4.94 3.72-8.69z"/>

            </svg>
            <span>Lanjutkan dengan Google</span>
          </button>

          <button type="button" class="social-btn apple" id="btnAppleAuth">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.37 1.6c0 1.14-.42 2.2-1.18 2.98-.8.82-1.92 1.38-3.04 1.3-.14-1.12.39-2.26 1.14-3.02.77-.8 2.02-1.36 3.08-1.26zm4.09 15.16c-.53 1.19-.79 1.72-1.48 2.78-.96 1.48-2.31 3.33-3.99 3.35-1.49.02-1.88-.96-3.9-.95-2.02.01-2.45.97-3.94.95-1.68-.02-2.96-1.69-3.92-3.17-2.69-4.13-2.98-8.97-1.31-11.53 1.18-1.81 3.05-2.87 4.8-2.87 1.78 0 2.9.97 4.38.97 1.44 0 2.31-.97 4.37-.97 1.56 0 3.21.85 4.39 2.31-3.85 2.11-3.22 7.6.6 9.13z"/>

            <span>Lanjutkan dengan Apple</span>

          ${
            isRegister
              ? `Sudah punya akun? <button type="button" id="btnSwitchToLogin" style="color:var(--color-primary);font-weight:800;">Masuk</button>`
              : `Belum punya akun? <button type="button" id="btnSwitchToReg" style="color:var(--color-primary);font-weight:800;">Daftar</button>`
          }
        </div>
      `;

      modal.classList.add("open");
      state.activeModal = mode;

      document.getElementById("btnCloseModal").addEventListener("click", closeModal);

      const swReg = document.getElementById("btnSwitchToReg");
      if (swLogin) swLogin.addEventListener("click", () => openAuthModal("login"));
      if (swReg) swReg.addEventListener("click", () => openAuthModal("register"));

      document.getElementById("authForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const phone = document.getElementById("authPhoneInput").value.trim();
        const nameInput = document.getElementById("authNameInput");
        const name = nameInput ? nameInput.value.trim() : "";

        if (isRegister && name.length < 2) {
          triggerModalError("Mohon isi nama lengkap minimal 2 karakter.");
          return;
        }
        if (phone.replace(/\D/g, "").length < 8) {
          triggerModalError("Masukkan nomor telepon yang valid (min. 8 digit).");
          return;
        }

        const displayName = isRegister ? name : `Sahabat Bite (${phone.slice(-4)})`;
        const submitBtn = sheet.querySelector(".auth-submit-btn");
        Anim.runLoginChoreography(submitBtn, {
          name: displayName,
          email: `${phone}@bite.id`,
          phone,
          photo: DEMO_ACCOUNTS.google[0].photo,
          provider: "phone",
          isDemo: false

      document.getElementById("btnGoogleAuth").addEventListener("click", (e) => {
        handleSocialAuthClick("google", e.currentTarget, e);

      document.getElementById("btnAppleAuth").addEventListener("click", (e) => {
        handleSocialAuthClick("apple", e.currentTarget, e);
      });
    }

      state.activeModal = null;

        modal.style.transition = "none";
        requestAnimationFrame(() => (modal.style.transition = ""));
      }
    }

              )

          date: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }),

        navigateTo("success");

      modal.classList.add("open");
      state.activeModal = "quick-menu";
      document.getElementById("btnCloseQuick").addEventListener("click", closeModal);
      sheet.querySelectorAll("[data-qcat]").forEach((b) => {
        b.addEventListener("click", () => {
          closeModal();
          selectCategory(b.dataset.qcat);
        });
      });
    }

    function openProfileSubSheet(sectionId) {
      const modal = document.getElementById("modalBackdrop");
      const sheet = document.getElementById("modalSheet");
      let title = "";
      let body = "";

      if (sectionId === "orders") {
        title = "Daftar Pesanan";
        body =
          state.orders.length === 0
            ? `<p style="color:var(--color-text-muted);font-size:13.5px;">Belum ada riwayat pesanan. Yuk pesan menu favoritmu!</p>`
            : state.orders
                .map(
                  (o) => `
                <div class="checkout-block" style="margin:0 0 10px;">
                  <div class="summary-line"><strong>#${o.id}</strong><span style="color:var(--color-success);font-weight:800;">${o.status}</span></div>
                  <div class="summary-line"><span>${o.date} • ${o.itemsCount} item</span><strong>${formatRp(o.total)}</strong></div>
                  <div style="font-size:11.5px;color:var(--color-text-muted);">${o.address}</div>
                </div>
              `
                )
                .join("");
      } else if (sectionId === "discounts") {
        title = "Diskon & Bonus";
        body = `
          <div class="checkout-block" style="margin:0 0 10px;background:#FFF7EB;border-color:var(--color-accent);">
            <div style="font-weight:800;color:var(--color-primary);font-size:15px;">BITE50 — Diskon Kilat 50%</div>
            <p style="font-size:12.5px;color:#5A3800;margin-top:4px;">Berlaku untuk pesanan Burger, Pizza &amp; Sushi dengan ongkos kirim gratis otomatis.</p>
          </div>
          <div class="checkout-block" style="margin:0;">
            <div style="font-weight:800;font-size:15px;">GRATISONGKIR — Bebas Biaya Kirim</div>
            <p style="font-size:12.5px;color:var(--color-text-muted);margin-top:4px;">Otomatis aktif di halaman Checkout tanpa minimal transaksi.</p>
          </div>
        `;
      } else if (sectionId === "addresses") {
        title = "Alamat Saya";
        body = `
          <p style="font-size:12.5px;color:var(--color-text-muted);margin-bottom:10px;">Alamat aktif saat ini:</p>
          <div class="checkout-block" style="margin:0 0 12px;"><strong>${state.address}</strong></div>
          <button class="btn-primary" id="btnPickAddrFromProfile">Ubah Alamat</button>
        `;
      } else if (sectionId === "cards") {
        title = "Kartu Saya";
        body = `
          <div class="checkout-block" style="margin:0;background:linear-gradient(135deg,#242424,#424242);color:#FFF;">
            <div style="font-size:11px;opacity:0.75;">VISA DEBIT</div>
            <div style="font-size:17px;font-weight:800;letter-spacing:0.12em;margin:12px 0;">•••• •••• •••• 4829</div>
            <div style="font-size:12px;opacity:0.9;">${state.user ? state.user.name : "Tamu Bite"} • Aktif untuk Checkout</div>
          </div>
        `;
      } else if (sectionId === "settings") {
        title = "Pengaturan";
        body = `
          <div class="profile-menu-item" style="margin-bottom:10px;">
            <span style="font-size:14px;font-weight:700;">Kurangi Animasi (Reduced Motion)</span>
            <input type="checkbox" id="toggleReduceMotion" ${state.reduceMotionManual ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--color-primary);" />
          </div>
          <button class="btn-secondary" id="btnResetDemoData" style="color:var(--color-primary);">Reset Data Lokal</button>
        `;
      } else {
        title = "Kontak Bite";
        body = `
          <div class="checkout-block" style="margin:0;">
            <div class="summary-line"><span>Layanan Pelanggan</span><strong>halo@bite.id</strong></div>
            <div class="summary-line"><span>WhatsApp</span><strong>+62 811-2233-4455</strong></div>
            <div class="summary-line" style="margin-bottom:0;"><span>Jam Operasional</span><strong>09.00 – 23.00 WIB</strong></div>
          </div>
        `;
      }

      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="modal-header">
          <h3 class="modal-title">${title}</h3>
          <button class="icon-btn" id="btnCloseSubSheet">✕</button>
        </div>
        ${body}
      `;
      modal.classList.add("open");
      state.activeModal = "profile-sub";
      document.getElementById("btnCloseSubSheet").addEventListener("click", closeModal);

      const pickAddr = document.getElementById("btnPickAddrFromProfile");
      if (pickAddr) pickAddr.addEventListener("click", openLocationSheet);

      const toggleRM = document.getElementById("toggleReduceMotion");
      if (toggleRM) {
        toggleRM.addEventListener("change", () => {
          state.reduceMotionManual = toggleRM.checked;
          safeStorage.set(STORAGE_KEYS.REDUCE_MOTION, state.reduceMotionManual);
          document.body.classList.toggle("reduce-motion", state.reduceMotionManual);
          Anim.showToast(state.reduceMotionManual ? "Animasi dikurangi" : "Animasi penuh aktif");
        });
      }

      const resetBtn = document.getElementById("btnResetDemoData");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          state.cart = [];
          state.favorites = [];
          state.orders = [];
          saveCart();
          saveFavorites();
          safeStorage.set(STORAGE_KEYS.ORDERS, []);
          closeModal();
          renderProfileScreen(false);
          Anim.showToast("Data lokal telah dibersihkan");
        });
      }
    }

    /* =========================================================================
       8. INISIALISASI APLIKASI & SPLASH SEQUENCE
       ========================================================================= */
    function initApp() {
      initPromoCarousel();
      initCategoryChips();
      renderFoodGrid(false);
      updateNavBadges();
      updateBottomNavPill("home");

      document.getElementById("currentLocationLabel").textContent = state.address.split(",").pop().trim();

      document.querySelectorAll(".nav-item").forEach((item) => {
        item.addEventListener("click", () => navigateTo(item.dataset.tab));
      });

      document.getElementById("btnMenuDrawer").addEventListener("click", openQuickDrawerSheet);
      document.getElementById("btnLocation").addEventListener("click", openLocationSheet);
      document.getElementById("modalBackdrop").addEventListener("click", (e) => {
        if (e.target.id === "modalBackdrop") closeModal();
      });

      // Urutan animasi Splash -> Beranda
      const splash = document.getElementById("splashScreen");
      const header = document.getElementById("homeHeader");
      const promo = document.getElementById("promoCarousel");

      const enterHome = () => {
        splash.classList.add("leaving");
        header.classList.remove("enter-ready");
        header.classList.add("entered");
        setTimeout(() => promo.classList.add("entered"), 120);
        setTimeout(() => (splash.style.display = "none"), 680);
      };

      const splashDelay = prefersReducedMotion() ? 250 : 1450;
      setTimeout(enterHome, splashDelay);
      splash.addEventListener("click", enterHome, { once: true });

      window.addEventListener("resize", () => moveCategoryIndicator());
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
