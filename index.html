<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bite — Pesan Makanan Cepat &amp; Hangat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <!-- Google Identity Services & Sign in with Apple JS -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
  <style>
    /* =========================================================================
       1. CSS VARIABLES & DESIGN TOKENS
       ========================================================================= */
    :root {
      --color-primary: #9B0A0A;
      --color-primary-dark: #780606;
      --color-primary-soft: rgba(155, 10, 10, 0.08);
      --color-accent: #FFB21A;
      --color-accent-dark: #E89600;
      --color-white: #FFFFFF;
      --color-bg: #FFFFFF;
      --color-input: #F2F2F2;
      --color-text: #1B1B1B;
      --color-text-muted: #757575;
      --color-border: #ECECEC;
      --color-success: #169C46;

      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-pill: 999px;

      --shadow-card: 0 10px 26px rgba(24, 10, 10, 0.07);
      --shadow-nav: 0 14px 32px rgba(155, 10, 10, 0.34);
      --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.14);

      --font-main: 'Raleway', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease-spring: cubic-bezier(0.22, 1.28, 0.36, 1);
      --ease-smooth: cubic-bezier(0.25, 0.8, 0.25, 1);

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: var(--font-main);
      color: var(--color-text);
      background: var(--color-bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, input, textarea {
      font-family: inherit;
      border: none;
      outline: none;
      background: none;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =========================================================================
       2. DESKTOP IPHONE FRAME & VERTICAL STRIPED BACKGROUND
       ========================================================================= */
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
    }

    .phone-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      background: var(--color-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .phone-notch,
    .phone-home-bar {
      display: none;
    }

    @media (min-width: 520px) {
      .stage {
        padding: 20px;
        background-color: #FFB21A;
        background-image: repeating-linear-gradient(
          90deg,
          #FFB21A 0px,
          #FFB21A 36px,
          #FFA10A 36px,
          #FFA10A 72px
        );
      }

      .phone-frame {
        width: 390px;
        height: min(844px, calc(100vh - 40px));
        border-radius: 48px;
        border: 11px solid #161618;
        box-shadow:
          0 32px 70px rgba(84, 24, 0, 0.36),
          0 0 0 2px #3A3A3F,
          inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        --safe-top: 26px;
        --safe-bottom: 14px;
      }

      .phone-notch {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 112px;
        height: 26px;
        background: #161618;
        border-radius: 999px;
        z-index: 950;
        pointer-events: none;
      }

      .phone-notch::after {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #23283A;
        margin-left: 54px;
        box-shadow: inset 0 0 2px rgba(255,255,255,0.25);
      }

      .phone-home-bar {
        display: block;
        position: absolute;
        bottom: 7px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.22);
        z-index: 950;
        pointer-events: none;
      }
    }

    /* =========================================================================
       3. APP SHELL, SCREENS, HEADER & FLOATING PILL NAV
       ========================================================================= */
    .app-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-bg);
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--color-bg);
      padding-top: var(--safe-top);
      padding-bottom: calc(108px + var(--safe-bottom));
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 14px, 0);
      transition: opacity 0.26s var(--ease-smooth), transform 0.28s var(--ease-smooth);
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
      z-index: 10;
    }

    .screen.no-nav-pad {
      padding-bottom: calc(28px + var(--safe-bottom));
    }

    /* --- Splash Screen --- */
    .splash-screen {
      position: absolute;
      inset: 0;
      z-index: 900;
      background: radial-gradient(circle at 50% 35%, #B51111 0%, #9B0A0A 68%, #7E0606 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      will-change: transform, opacity;
      transition: transform 0.65s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.5s ease;
    }

    .splash-screen.leaving {
      transform: translate3d(0, -100%, 0);
      pointer-events: none;
    }

    .splash-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.72);
      animation: splashLogoIn 0.65s var(--ease-spring) 0.12s forwards;
    }

    .splash-tagline {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUpSimple 0.45s ease 0.55s forwards;
    }

    .splash-swoosh-path {
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: drawStroke 0.72s cubic-bezier(0.35, 0, 0.2, 1) 0.35s forwards;
    }

    /* --- Header Beranda --- */
    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 8px;
      background: var(--color-white);
      position: sticky;
      top: 0;
      z-index: 30;
      transition: transform 0.45s var(--ease-spring), opacity 0.4s ease;
    }

    .home-header.enter-ready {
      opacity: 0;
      transform: translate3d(0, -24px, 0);
    }

    .home-header.entered {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-input);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text);
      transition: transform 0.16s var(--ease-spring), background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      max-width: 144px;
      transition: transform 0.16s var(--ease-spring);
    }

    .location-pill span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-pill:active {
      transform: scale(0.95);
    }

    /* --- Promo Carousel --- */
    .promo-section {
      padding: 8px 18px 12px;
      overflow: hidden;
    }

    .promo-carousel {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(155, 10, 10, 0.18);
      transform: translate3d(42px, 0, 0);
      opacity: 0;
      transition: transform 0.55s var(--ease-spring), opacity 0.45s ease;
    }

    .promo-carousel.entered {
      transform: translate3d(0, 0, 0);
      opacity: 1;
    }

    .promo-track {
      display: flex;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .promo-slide {
      flex: 0 0 100%;
      padding: 18px 20px;
      min-height: 138px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      color: var(--color-white);
    }

    .promo-slide.theme-red {
      background: linear-gradient(125deg, #9B0A0A 0%, #C81515 62%, #FF6B1A 100%);
    }

    .promo-slide.theme-gold {
      background: linear-gradient(125deg, #FFB21A 0%, #FF8800 58%, #9B0A0A 100%);
    }

    .promo-slide.theme-dark {
      background: linear-gradient(125deg, #700505 0%, #9B0A0A 55%, #FFB21A 100%);
    }

    .promo-badge-50 {
      display: inline-block;
      background: var(--color-accent);
      color: #3C1100;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .promo-slide.theme-gold .promo-badge-50 {
      background: var(--color-primary);
      color: var(--color-white);
    }

    .promo-text {
      position: relative;
      z-index: 2;
      max-width: 64%;
    }

    .promo-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .promo-sub {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.92;
      line-height: 1.35;
    }

    .promo-big-percent {
      position: relative;
      z-index: 2;
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      letter-spacing: -0.04em;
    }

    .promo-circle-decor {
      position: absolute;
      right: -24px;
      top: -28px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .promo-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .promo-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #DFDFDF;
      transition: width 0.28s var(--ease-spring), background-color 0.25s ease;
    }

    .promo-dot.active {
      width: 22px;
      background: var(--color-primary);
    }

    /* --- Category Chips --- */
    .category-wrap {
      padding: 6px 18px 10px;
    }

    .category-scroll {
      position: relative;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 6px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-indicator {
      position: absolute;
      top: 4px;
      left: 0;
      height: 38px;
      border-radius: var(--radius-pill);
      background: var(--color-primary);
      box-shadow: 0 6px 14px rgba(155, 10, 10, 0.26);
      transition: transform 0.34s var(--ease-spring), width 0.34s var(--ease-spring);
      z-index: 0;
      pointer-events: none;
    }

    .cat-chip {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      height: 38px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: var(--color-input);
      color: var(--color-text);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.24s ease, background-color 0.24s ease, transform 0.15s ease;
    }

    .cat-chip.active {
      background: transparent;
      color: var(--color-white);
    }

    .cat-chip:active {
      transform: scale(0.95);
    }

    /* --- Section Heading --- */
    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 18px 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .section-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
    }

    /* --- Food Grid (2 Kolom) --- */
    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 4px 18px 14px;
      perspective: 900px;
    }

    .food-grid.grid-flipping {
      animation: gridFlipFade 0.34s var(--ease-smooth);
    }

    .food-card {
      position: relative;
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: 12px 12px 14px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.22s ease;
      will-change: transform, opacity;
      cursor: pointer;
    }

    .food-card.stagger-in {
      opacity: 0;
      transform: translate3d(0, 26px, 0);
    }

    .food-card.stagger-shown {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition: transform 0.45s var(--ease-spring), opacity 0.38s ease, box-shadow 0.2s ease;
    }

    .food-card:hover {
      box-shadow: 0 14px 30px rgba(155, 10, 10, 0.11);
    }

    .food-card:active {
      transform: scale(0.97);
    }

    .card-fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 4;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #B5B5B5;
      transition: transform 0.18s var(--ease-spring), color 0.2s ease;
    }

    .card-fav-btn.liked {
      color: var(--color-primary);
    }

    .card-fav-btn.pop {
      animation: heartPop 0.42s var(--ease-spring);
    }

    .card-img-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.88;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #FFF7EB;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    .card-img-stage::before {
      content: '';
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 178, 26, 0.22) 0%, rgba(155, 10, 10, 0.06) 100%);
      pointer-events: none;
    }

    .food-img-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      will-change: transform;
      transition: transform 0.18s ease-out;
    }

    .food-img-float {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-md);
      animation: floatBob 4.2s ease-in-out infinite;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .food-img-float.loaded {
      opacity: 1;
    }

    /* Skeleton Shimmer */
    .skeleton-box {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #F1F1F1 25%, #FAFAFA 50%, #F1F1F1 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite linear;
      z-index: 1;
    }

    .skeleton-box.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .card-name {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 3px;
      color: var(--color-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-weight {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-price {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .card-add-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 12px rgba(155, 10, 10, 0.25);
      transition: transform 0.16s var(--ease-spring), background-color 0.2s ease;
    }

    .card-add-btn:hover {
      background: var(--color-primary-dark);
    }

    .card-add-btn:active {
      transform: scale(0.88);
    }

    /* --- Floating Red Pill Bottom Navigation --- */
    .bottom-nav-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(14px + var(--safe-bottom));
      display: flex;
      justify-content: center;
      z-index: 120;
      pointer-events: none;
      transition: transform 0.32s var(--ease-spring), opacity 0.25s ease;
    }

    .bottom-nav-wrap.hidden {
      transform: translate3d(0, 110px, 0);
      opacity: 0;
    }

    .bottom-nav-pill {
      position: relative;
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      width: calc(100% - 36px);
      max-width: 354px;
      height: 64px;
      padding: 6px;
      border-radius: var(--radius-pill);
      background: var(--color-primary);
      box-shadow: var(--shadow-nav);
    }

    .nav-active-pill {
      position: absolute;
      top: 6px;
      left: 6px;
      width: calc((100% - 12px) / 4);
      height: 52px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.18);
      transition: transform 0.36s var(--ease-spring);
      z-index: 0;
      pointer-events: none;
    }

    .nav-item {
      position: relative;
      z-index: 1;
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 10px;
      font-weight: 700;
      transition: color 0.22s ease;
    }

    .nav-item.active {
      color: var(--color-white);
    }

    .nav-item.active svg {
      animation: navIconHop 0.42s var(--ease-spring);
    }

    .nav-badge {
      position: absolute;
      top: 4px;
      right: 16px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--color-accent);
      color: #2B0D00;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--color-primary);
      transform: scale(1);
      transition: transform 0.2s var(--ease-spring), opacity 0.2s ease;
    }

    .nav-badge.empty {
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }

    .nav-badge.bounce {
      animation: badgeBounce 0.48s var(--ease-spring);
    }

    /* =========================================================================
       4. DETAIL PRODUK, KERANJANG, FAVORIT, PROFIL & CHECKOUT
       ========================================================================= */
    .sub-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 8px;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      z-index: 25;
    }

    .sub-topbar.transparent {
      background: transparent;
      backdrop-filter: none;
      position: absolute;
      top: var(--safe-top);
      left: 0;
      right: 0;
    }

    .sub-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* --- Product Detail --- */
    .detail-hero {
      position: relative;
      padding: 58px 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .detail-red-circle {
      position: absolute;
      top: -120px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #BA1010 0%, #9B0A0A 75%);
      box-shadow: 0 18px 40px rgba(155, 10, 10, 0.24);
      z-index: 0;
    }

    .detail-photo-frame {
      position: relative;
      z-index: 1;
      width: 224px;
      height: 224px;
      border-radius: 50%;
      overflow: hidden;
      border: 6px solid var(--color-white);
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.2);
      background: #FFF6E8;
    }

    .detail-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-body {
      padding: 8px 20px 24px;
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .detail-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }

    .detail-weight {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      background: var(--color-input);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .detail-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--color-primary);
      white-space: nowrap;
    }

    .detail-section-label {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin: 16px 0 8px;
    }

    .ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .ingredient-tag {
      background: #FFF7EB;
      color: #6B3D00;
      border: 1px solid rgba(255, 178, 26, 0.4);
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
    }

    .addon-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .addon-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--color-input);
    }

    .addon-name {
      font-size: 14px;
      font-weight: 700;
    }

    .addon-price {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
      margin-top: 2px;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--color-white);
      padding: 4px;
      border-radius: var(--radius-pill);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }

    .step-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--color-input);
      color: var(--color-text);
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s var(--ease-spring), background-color 0.2s ease, color 0.2s ease;
    }

    .step-btn.plus {
      background: var(--color-primary);
      color: var(--color-white);
    }

    .step-btn:active {
      transform: scale(0.88);
    }

    .step-val {
      min-width: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }

    .detail-bottom-bar {
      position: sticky;
      bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 18px calc(16px + var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--color-border);
      z-index: 20;
    }

    /* --- Buttons --- */
    .btn-primary {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-pill);
      background: var(--color-primary);
      color: var(--color-white);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 22px rgba(155, 10, 10, 0.26);
      position: relative;
      overflow: hidden;
      transition: transform 0.16s var(--ease-spring), background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--color-primary-dark);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      width: 100%;
      height: 50px;
      border-radius: var(--radius-pill);
      background: var(--color-input);
      color: var(--color-text);
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.16s var(--ease-spring), background-color 0.2s ease;
    }

    .btn-secondary:active {
      transform: scale(0.96);
    }

    /* --- Cart & Favorites Lists --- */
    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 18px 18px;
    }

    .cart-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .cart-thumb {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      object-fit: cover;
      flex-shrink: 0;
      background: #FFF6E8;
    }

    .cart-info {
      flex: 1;
      min-width: 0;
    }

    .cart-name {
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .cart-addons {
      font-size: 11px;
      color: var(--color-text-muted);
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .cart-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cart-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .trash-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(155, 10, 10, 0.08);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s var(--ease-spring);
    }

    .trash-btn:active {
      transform: scale(0.88);
    }

    .cart-cta-wrap {
      padding: 6px 18px 16px;
    }

    .empty-state {
      padding: 46px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-icon-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--color-text-muted);
      line-height: 1.5;
      max-width: 260px;
    }

    /* --- Profile --- */
    .profile-guest-card {
      margin: 12px 18px;
      padding: 26px 20px;
      border-radius: var(--radius-xl);
      background: linear-gradient(155deg, #FFF7EB 0%, #FFFFFF 68%);
      border: 1px solid rgba(255, 178, 26, 0.35);
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .profile-guest-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px rgba(155, 10, 10, 0.25);
    }

    .profile-user-header {
      margin: 10px 18px 16px;
      padding: 18px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, #9B0A0A 0%, #B81212 100%);
      color: var(--color-white);
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 14px 28px rgba(155, 10, 10, 0.24);
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--color-accent);
      background: var(--color-white);
      flex-shrink: 0;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .profile-email {
      font-size: 12.5px;
      opacity: 0.9;
      word-break: break-all;
    }

    .profile-provider-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.18);
      font-size: 10.5px;
      font-weight: 700;
    }

    .profile-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 18px 18px;
    }

    .profile-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--color-white);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--color-border);
      transition: transform 0.16s var(--ease-spring), background-color 0.2s ease;
    }

    .profile-menu-item:active {
      transform: scale(0.98);
      background: #FAFAFA;
    }

    .profile-menu-item.stagger-row {
      opacity: 0;
      transform: translate3d(0, 14px, 0);
    }

    .profile-menu-item.stagger-row.shown {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition: opacity 0.35s ease, transform 0.38s var(--ease-spring);
    }

    .profile-menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14.5px;
      font-weight: 700;
    }

    .profile-menu-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-menu-item.logout .profile-menu-icon {
      background: rgba(155, 10, 10, 0.14);
    }

    .profile-menu-item.logout {
      color: var(--color-primary);
      margin-top: 6px;
    }

    /* --- Checkout & Order Success --- */
    .checkout-block {
      margin: 10px 18px;
      padding: 16px;
      background: var(--color-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
    }

    .checkout-block-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-field {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--color-input);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      border: 1.5px solid transparent;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .input-field:focus {
      background: var(--color-white);
      border-color: var(--color-primary);
    }

    .pay-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .pay-option {
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--color-input);
      border: 2px solid transparent;
      text-align: left;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
    }

    .pay-option.selected {
      background: #FFF8EB;
      border-color: var(--color-primary);
    }

    .pay-option:active {
      transform: scale(0.97);
    }

    .pay-name {
      font-size: 13px;
      font-weight: 800;
    }

    .pay-sub {
      font-size: 11px;
      color: var(--color-text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 8px;
    }

    .summary-line.free strong {
      color: var(--color-success);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 800;
      padding-top: 10px;
      border-top: 1px dashed #DFDFDF;
      color: var(--color-text);
    }

    .summary-total span:last-child {
      color: var(--color-primary);
    }

    .success-screen-wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      text-align: center;
      gap: 14px;
    }

    .success-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 36px rgba(155, 10, 10, 0.28);
      animation: popIn 0.5s var(--ease-spring);
    }

    /* =========================================================================
       5. MODALS (DAFTAR, MASUK, DEMO ACCOUNT PICKER, DRAWER SHEETS)
       ========================================================================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 6, 6, 0.56);
      backdrop-filter: blur(4px);
      z-index: 400;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.26s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-height: 88%;
      overflow-y: auto;
      background: var(--color-white);
      border-radius: 30px 30px 0 0;
      padding: 14px 22px calc(26px + var(--safe-bottom));
      transform: translate3d(0, 100%, 0);
      transition: transform 0.36s var(--ease-spring);
      position: relative;
    }

    .modal-backdrop.open .modal-sheet {
      transform: translate3d(0, 0, 0);
    }

    .modal-sheet.shake {
      animation: modalShake 0.44s ease;
    }

    .sheet-handle {
      width: 44px;
      height: 5px;
      border-radius: 999px;
      background: #E0E0E0;
      margin: 0 auto 14px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
    }

    .modal-error-banner {
      background: #FFF0F0;
      color: var(--color-primary);
      border: 1px solid rgba(155, 10, 10, 0.22);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
      animation: slideDownErr 0.28s var(--ease-spring);
    }

    .modal-error-banner.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }

    .divider-or {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: var(--color-text-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .divider-or::before,
    .divider-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .social-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .social-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 52px;
      border-radius: var(--radius-pill);
      font-size: 14.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition:
        width 0.32s var(--ease-spring),
        transform 0.16s var(--ease-spring),
        opacity 0.24s ease,
        background-color 0.22s ease;
    }

    .social-btn.google {
      background: var(--color-white);
      color: var(--color-text);
      border: 1.5px solid #E2E2E2;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .social-btn.apple {
      background: #111111;
      color: var(--color-white);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    .social-btn.pressing {
      transform: scale(0.96);
    }

    .social-btn.morphed {
      width: 52px !important;
      padding: 0;
    }

    .social-btn.faded-out {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.94);
    }

    .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(155, 10, 10, 0.18);
      transform: scale(0);
      animation: rippleAnim 0.55s ease-out forwards;
      pointer-events: none;
    }

    .social-btn.apple .btn-ripple {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(155, 10, 10, 0.2);
      border-top-color: var(--color-primary);
      animation: spin 0.75s linear infinite;
    }

    .social-btn.apple .btn-spinner {
      border-color: rgba(255, 255, 255, 0.24);
      border-top-color: var(--color-white);
    }

    .btn-check-svg path {
      stroke-dasharray: 42;
      stroke-dashoffset: 42;
      animation: drawStroke 0.42s ease forwards;
    }

    .demo-account-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--color-input);
      margin-bottom: 10px;
      text-align: left;
      transition: transform 0.15s var(--ease-spring), background-color 0.2s ease;
    }

    .demo-account-row:active {
      transform: scale(0.98);
      background: #E8E8E8;
    }

    .demo-account-row img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* =========================================================================
       6. OVERLAYS: CIRCULAR REVEAL AUTH, FLY-TO-CART, TOAST, CONFETTI
       ========================================================================= */
    .auth-reveal-overlay {
      position: absolute;
      inset: 0;
      z-index: 800;
      background: radial-gradient(circle at 50% 40%, #B81111 0%, #9B0A0A 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--color-white);
      clip-path: circle(0px at 50% 50%);
      pointer-events: none;
      opacity: 0;
    }

    .auth-reveal-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--color-accent);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: scale(0.7);
    }

    .auth-reveal-greeting {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translate3d(0, 18px, 0);
    }

    .auth-reveal-sub {
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translate3d(0, 12px, 0);
      color: rgba(255, 255, 255, 0.86);
    }

    .confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 860;
      pointer-events: none;
    }

    .toast-pill {
      position: absolute;
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translate3d(-50%, -80px, 0);
      background: #1B1B1B;
      color: var(--color-white);
      padding: 10px 16px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      z-index: 920;
      opacity: 0;
      white-space: nowrap;
      transition: transform 0.32s var(--ease-spring), opacity 0.25s ease;
      pointer-events: none;
    }

    .toast-pill.show {
      transform: translate3d(-50%, 0, 0);
      opacity: 1;
    }

    /* =========================================================================
       7. KEYFRAMES & PREFERS-REDUCED-MOTION
       ========================================================================= */
    @keyframes splashLogoIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUpSimple {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes floatBob {
      0%, 100% { transform: translate3d(0, 0px, 0); }
      50% { transform: translate3d(0, -5px, 0); }
    }
    @keyframes heartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.36); }
      75% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    @keyframes badgeBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.42); }
      70% { transform: scale(0.88); }
      100% { transform: scale(1); }
    }
    @keyframes navIconHop {
      0% { transform: translate3d(0, 0, 0); }
      40% { transform: translate3d(0, -5px, 0) scale(1.12); }
      100% { transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes gridFlipFade {
      0% { opacity: 0.25; transform: perspective(700px) rotateX(8deg) scale(0.97); }
      100% { opacity: 1; transform: perspective(700px) rotateX(0deg) scale(1); }
    }
    @keyframes modalShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-9px, 0, 0); }
      40% { transform: translate3d(9px, 0, 0); }

      get(key, fallback) {
        try {
          const raw = window.localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          return key in memoryFallback ? memoryFallback[key] : fallback;
        }
      },
      set(key, val) {
        memoryFallback[key] = val;
        try {
          window.localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {
          // Abaikan bila mode privat/kuota penuh
        }
      },
      remove(key) {
        delete memoryFallback[key];
        try {
          window.localStorage.removeItem(key);
        } catch (e) {}
      }
    };

      return PRODUCTS.find((p) => p.id === id);
    }

    function prefersReducedMotion() {
      return (
        state.reduceMotionManual ||
        (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)
      );
    }

    function getCartCount() {
      return state.cart.reduce((sum, item) => sum + item.qty, 0);
    }

    function getCartSubtotal() {
      return state.cart.reduce((sum, item) => {
        const product = getProduct(item.productId);
        if (!product) return sum;
        const addonsCost = (item.addons || []).reduce((aSum, a) => aSum + a.price * a.qty, 0);
        return sum + (product.price + addonsCost) * item.qty;
      }, 0);
    }

    /* =========================================================================
       4. ROUTER ANTAR LAYAR & ANDROID BACK HANDLER
       ========================================================================= */
    const TAB_ORDER = ["home", "cart", "favorites", "profile"];

    function navigateTo(screenName, options = {}) {
      const { pushHistory = true } = options;
      const prev = state.route;
      if (prev === screenName && screenName !== "detail") return;

      state.route = screenName;
      if (pushHistory && state.history[state.history.length - 1] !== screenName) {
        state.history.push(screenName);
      }

      document.querySelectorAll(".screen").forEach((el) => {
        el.classList.toggle("active", el.id === `screen-${screenName}`);
      });

      const showNav = TAB_ORDER.includes(screenName);
      const navWrap = document.getElementById("bottomNavWrap");
      navWrap.classList.toggle("hidden", !showNav);

      if (showNav) {
        updateBottomNavPill(screenName);
      }

      if (screenName === "home") renderFoodGrid(false);
      if (screenName === "cart") renderCartScreen();
      if (screenName === "favorites") renderFavoritesScreen();
      if (screenName === "profile") renderProfileScreen(false);
      if (screenName === "checkout") renderCheckoutScreen();
      if (screenName === "success") renderSuccessScreen();

      const activeEl = document.getElementById(`screen-${screenName}`);
      if (activeEl) activeEl.scrollTop = 0;
    }

    function goBack() {
      if (state.activeModal) {
        closeModal();
        return true;
      }
      if (state.route === "detail" || state.route === "checkout" || state.route === "success") {
        state.history.pop();
        const target = state.history[state.history.length - 1] || "home";
        navigateTo(target, { pushHistory: false });
        return true;
      }
      if (state.route !== "home") {
        state.history = ["home"];
        navigateTo("home", { pushHistory: false });
        return true;
      }
      return false;
    }

    // Dipanggil oleh Android MainActivity BackHandler
    window.__biteHandleBack = function () {
      return goBack();
    };

    /* =========================================================================
       5. MODUL ANIMASI (WAAPI, rAF FLY-TO-CART, HEART BURST, CONFETTI, TILT)
       ========================================================================= */
    const Anim = {
      toastTimer: null,

      showToast(msg) {
        const toast = document.getElementById("toastPill");
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
      },

      bounceBadge(badgeEl) {
        if (!badgeEl || prefersReducedMotion()) return;
        badgeEl.classList.remove("bounce");
        void badgeEl.offsetWidth;
        badgeEl.classList.add("bounce");
      },

      flyToCart(sourceEl, imgSrc) {
        const cartBtn = document.getElementById("navCartBtn");
        const viewport = document.getElementById("appViewport");
        if (!sourceEl || !cartBtn || !viewport || prefersReducedMotion()) {
          this.bounceBadge(document.getElementById("cartBadge"));
          return;
        }

        const vpRect = viewport.getBoundingClientRect();
        const startRect = sourceEl.getBoundingClientRect();
        const endRect = cartBtn.getBoundingClientRect();

        const startX = startRect.left - vpRect.left + startRect.width / 2 - 22;
        const startY = startRect.top - vpRect.top + startRect.height / 2 - 22;
        const endX = endRect.left - vpRect.left + endRect.width / 2 - 14;
        const endY = endRect.top - vpRect.top + endRect.height / 2 - 14;

        const flyer = document.createElement("img");
        flyer.src = imgSrc;
        flyer.alt = "";
        flyer.style.cssText = `
          position: absolute;
          left: 0; top: 0;
          width: 44px; height: 44px;
          border-radius: 50%;
          object-fit: cover;
          border: 2px solid #FFFFFF;
          box-shadow: 0 8px 18px rgba(155,10,10,0.3);
          z-index: 890;
          pointer-events: none;
          will-change: transform, opacity;
        `;
        viewport.appendChild(flyer);

        const duration = 560;
        const t0 = performance.now();
        const ctrlX = (startX + endX) / 2 + (startX < endX ? -24 : 24);
        const ctrlY = Math.min(startY, endY) - 90;

        const step = (now) => {
          const p = Math.min(1, (now - t0) / duration);
          const ease = 1 - Math.pow(1 - p, 3);
          const inv = 1 - ease;
          const x = inv * inv * startX + 2 * inv * ease * ctrlX + ease * ease * endX;
          const y = inv * inv * startY + 2 * inv * ease * ctrlY + ease * ease * endY;
          const scale = 1 - 0.56 * ease;
          const opacity = p > 0.8 ? 1 - (p - 0.8) / 0.2 : 1;

          flyer.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
          flyer.style.opacity = String(opacity);

          if (p < 1) {
            requestAnimationFrame(step);
          } else {
            flyer.remove();
            this.bounceBadge(document.getElementById("cartBadge"));
          }
        };
        requestAnimationFrame(step);
      },

      heartParticleBurst(anchorEl) {
        const viewport = document.getElementById("appViewport");
        if (!anchorEl || !viewport || prefersReducedMotion()) return;
        const vpRect = viewport.getBoundingClientRect();
        const rect = anchorEl.getBoundingClientRect();
        const cx = rect.left - vpRect.left + rect.width / 2;
        const cy = rect.top - vpRect.top + rect.height / 2;

        const colors = ["#9B0A0A", "#FFB21A", "#FF4D4D", "#FFD166"];
        for (let i = 0; i < 8; i++) {
          const dot = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 8;
          const dist = 20 + Math.random() * 14;
          dot.style.cssText = `
            position: absolute;
            left: ${cx - 3}px;
            top: ${cy - 3}px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: ${colors[i % colors.length]};
            pointer-events: none;
            z-index: 880;
          `;
          viewport.appendChild(dot);
          dot.animate(
            [
              { transform: "translate3d(0,0,0) scale(1)", opacity: 1 },
              {
                transform: `translate3d(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px, 0) scale(0.2)`,
                opacity: 0
              }
            ],
            { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
          ).onfinish = () => dot.remove();
        }
      },

      launchConfetti() {
        if (prefersReducedMotion()) return;
        const canvas = document.getElementById("confettiCanvas");
        const viewport = document.getElementById("appViewport");
        if (!canvas || !viewport) return;

        const rect = viewport.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        const ctx = canvas.getContext("2d");

        const colors = ["#9B0A0A", "#FFB21A", "#FF4D4D", "#FFE066", "#FFFFFF"];
        const pieces = Array.from({ length: 48 }, () => ({
          x: rect.width * (0.2 + Math.random() * 0.6),
          y: rect.height * 0.38,
          vx: (Math.random() - 0.5) * 9,
          vy: -Math.random() * 10 - 3,
          size: 5 + Math.random() * 5,
          rot: Math.random() * 360,
          vr: (Math.random() - 0.5) * 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        }));

        const start = performance.now();
        const draw = (now) => {
          const elapsed = now - start;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          pieces.forEach((p) => {
            p.vy += 0.32;
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vr;
            if (elapsed > 950) p.alpha = Math.max(0, p.alpha - 0.035);
            if (p.alpha > 0 && p.y < canvas.height + 20) {
              alive = true;
              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.translate(p.x, p.y);
              ctx.rotate((p.rot * Math.PI) / 180);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
              ctx.restore();
            }
          });
          if (alive && elapsed < 2200) {
            requestAnimationFrame(draw);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        };
        requestAnimationFrame(draw);
      },

      addRipple(btn, clientX, clientY) {
        if (prefersReducedMotion()) return;
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "btn-ripple";
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        const x = (clientX ? clientX - rect.left : rect.width / 2) - size / 2;
        const y = (clientY ? clientY - rect.top : rect.height / 2) - size / 2;
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 580);
      },

      async runLoginChoreography(btnEl, userObj) {

        const vpRect = viewport.getBoundingClientRect();

            <path d="M5 13l4 4L19 7" stroke="${btnEl.classList.contains("apple") ? "#FFFFFF" : "#9B0A0A"}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
        btnEl.animate(
          [
            { transform: "translate3d(0,0,0)" },
            { transform: "translate3d(-3px,0,0)" },

            { transform: "translate3d(0,0,0)" }
          ],

        );
        await waitMs(480);

        // Langkah 4: Lingkaran merah membesar (circular reveal clip-path) + "Halo, {nama}!"
        const overlay = document.getElementById("authRevealOverlay");

        overlay.style.opacity = "1";

        const maxRadius = Math.hypot(vpRect.width, vpRect.height) + 40;
        await overlay.animate(

          { duration: 540, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
        ).finished;

        revAvatar.animate(
          [
            { opacity: 0, transform: "scale(0.65)" },
            { opacity: 1, transform: "scale(1)" }
          ],
          { duration: 360, easing: "cubic-bezier(0.22, 1.28, 0.36, 1)", fill: "forwards" }
        );
        revGreeting.animate(
          [
            { opacity: 0, transform: "translate3d(0, 18px, 0)" },
            { opacity: 1, transform: "translate3d(0, 0, 0)" }
          ],
          { duration: 380, delay: 90, easing: "ease-out", fill: "forwards" }
        );
        revSub.animate(
          [
            { opacity: 0, transform: "translate3d(0, 12px, 0)" },
            { opacity: 1, transform: "translate3d(0, 0, 0)" }
          ],
          { duration: 360, delay: 160, easing: "ease-out", fill: "forwards" }
        );

        // Langkah 6: Percikan confetti merah & kuning
        this.launchConfetti();
        await waitMs(860);

        // Langkah 5: Transisi ke Profil dengan shared-element avatar terbang + stagger 60ms
        closeModal(true);
        saveUser(userObj);
        navigateTo("profile");
        renderProfileScreen(true);

        const targetAvatar = document.getElementById("profileAvatarImg");
        const startAvRect = revAvatar.getBoundingClientRect();
        let flyingAvatar = null;
        if (targetAvatar) {
          const endAvRect = targetAvatar.getBoundingClientRect();
          targetAvatar.style.opacity = "0";
          flyingAvatar = document.createElement("img");
          flyingAvatar.src = userObj.photo;
          flyingAvatar.style.cssText = `
            position: absolute;
            left: ${startAvRect.left - vpRect.left}px;
            top: ${startAvRect.top - vpRect.top}px;
            width: ${startAvRect.width}px;

          viewport.appendChild(flyingAvatar);

          const dx = endAvRect.left - startAvRect.left;
          const dy = endAvRect.top - startAvRect.top;
          const scaleRatio = endAvRect.width / startAvRect.width;

          flyingAvatar.animate(
            [
              { transform: "translate3d(0,0,0) scale(1)" },
              { transform: `translate3d(${dx}px, ${dy}px, 0) scale(${scaleRatio})` }
            ],
            { duration: 480, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }

    /* =========================================================================
       6. MODUL AUTH (GOOGLE IDENTITY SERVICES, APPLE JS & MODE DEMO)
       ========================================================================= */
    function isGoogleConfigured() {
      return Boolean(GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.trim().length > 10);
    }

    function isAppleConfigured() {
      return Boolean(APPLE_CLIENT_ID && APPLE_CLIENT_ID.trim().length > 3);
    }

    function decodeJwtPayload(token) {
      try {
        const base64Url = token.split(".")[1];
        const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
            .join("")
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    function triggerModalError(message) {
      const sheet = document.getElementById("modalSheet");
      const errBox = document.getElementById("modalErrorBanner");
      if (errBox) {
        errBox.textContent = message;
        errBox.classList.add("show");
      }
      if (sheet && !prefersReducedMotion()) {
        sheet.classList.remove("shake");
        void sheet.offsetWidth;
        sheet.classList.add("shake");
      }
    }

    function handleSocialAuthClick(provider, btnEl, event) {
      Anim.addRipple(btnEl, event?.clientX, event?.clientY);
      state.pendingAuthBtn = btnEl;

      if (provider === "google" && isGoogleConfigured() && window.google?.accounts?.id) {
        try {
          window.google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: (response) => {
              const payload = decodeJwtPayload(response.credential);
              if (payload) {
                Anim.runLoginChoreography(btnEl, {
                  name: payload.name || "Pengguna Google",
                  email: payload.email || "",
                  photo: payload.picture || DEMO_ACCOUNTS.google[0].photo,
                  provider: "google",
                  isDemo: false
                });
              } else {
                triggerModalError("Gagal memverifikasi token Google.");
              }
            }
          });
          window.google.accounts.id.prompt((notification) => {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              openDemoPickerSheet("google", btnEl);
            }
          });
        } catch (err) {
          triggerModalError("Layanan Google Sign-In sedang tidak tersedia.");
        }
        return;
      }

      if (provider === "apple" && isAppleConfigured() && window.AppleID?.auth) {
        try {
          window.AppleID.auth.init({
            clientId: APPLE_CLIENT_ID,
            scope: "name email",
            redirectURI: APPLE_REDIRECT_URI,
            usePopup: true
          });
          window.AppleID.auth
            .signIn()
            .then((res) => {
              const firstName = res?.user?.name?.firstName || "Pengguna";
              const lastName = res?.user?.name?.lastName || "Apple";
              Anim.runLoginChoreography(btnEl, {
                name: `${firstName} ${lastName}`.trim(),
                email: res?.user?.email || "user@privaterelay.appleid.com",
                photo: DEMO_ACCOUNTS.apple[0].photo,
                provider: "apple",
                isDemo: false
              });
            })
            .catch(() => {
              triggerModalError("Login dengan Apple dibatalkan atau gagal.");
            });
        } catch (err) {
          triggerModalError("Gagal memuat Sign in with Apple.");
        }
        return;
      }

      // MODE DEMO OTOMATIS (jika Client ID belum diisi)
      openDemoPickerSheet(provider, btnEl);
    }

      const accounts = DEMO_ACCOUNTS[provider] || DEMO_ACCOUNTS.google;
      const providerName = provider === "apple" ? "Apple" : "Google";
      const modal = document.getElementById("modalBackdrop");

      sheet.innerHTML = `
        <div class="sheet-handle"></div>

          Client ID ${providerName} belum diisi di konfigurasi skrip, sehingga Bite menjalankan simulasi pemilih akun.

    /* =========================================================================
       7. KOMPONEN UI & RENDERER LAYAR
       ========================================================================= */
    function initPromoCarousel() {
      const track = document.getElementById("promoTrack");
      const dots = document.getElementById("promoDots");

      track.innerHTML = PROMOS.map(
        (p, idx) => `
          <div class="promo-slide ${p.theme}" data-promo-cat="${p.category}" data-idx="${idx}">
            <div class="promo-circle-decor"></div>
            <div class="promo-text">
              <span class="promo-badge-50">${p.badge}</span>
              <div class="promo-title">${p.title}</div>
              <div class="promo-sub">${p.sub}</div>
            </div>
            <div class="promo-big-percent">${p.percent}</div>
          </div>
        `
      ).join("");

      dots.innerHTML = PROMOS.map(
        (_, idx) => `<button class="promo-dot ${idx === 0 ? "active" : ""}" data-dot="${idx}" aria-label="Slide ${idx + 1}"></button>`
      ).join("");

      track.querySelectorAll(".promo-slide").forEach((slide) => {
        slide.addEventListener("click", () => {
          selectCategory(slide.dataset.promoCat);
        });
      });

      dots.querySelectorAll(".promo-dot").forEach((dot) => {
        dot.addEventListener("click", () => {
          setPromoSlide(Number(dot.dataset.dot));
        });
      });

      // Swipe support
      let startX = 0;
      track.addEventListener("touchstart", (e) => (startX = e.touches[0].clientX), { passive: true });
      track.addEventListener("touchend", (e) => {
        const diff = e.changedTouches[0].clientX - startX;
        if (Math.abs(diff) > 36) {
          const next = diff < 0 ? (state.promoIndex + 1) % PROMOS.length : (state.promoIndex - 1 + PROMOS.length) % PROMOS.length;
          setPromoSlide(next);
        }
      });

      setInterval(() => {
        if (state.route === "home" && !state.activeModal) {
          setPromoSlide((state.promoIndex + 1) % PROMOS.length);
        }
      }, 4200);
    }

    function setPromoSlide(index) {
      state.promoIndex = index;
      const track = document.getElementById("promoTrack");
      track.style.transform = `translate3d(-${index * 100}%, 0, 0)`;
      document.querySelectorAll(".promo-dot").forEach((d, idx) => {
        d.classList.toggle("active", idx === index);
      });
    }

    function initCategoryChips() {
      const container = document.getElementById("categoryScroll");
      const indicator = document.getElementById("categoryIndicator");

      CATEGORIES.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = `cat-chip ${cat.id === state.activeCategory ? "active" : ""}`;
        btn.dataset.cat = cat.id;
        btn.innerHTML = `<span>${cat.icon}</span><span>${cat.label}</span>`;
        btn.addEventListener("click", () => selectCategory(cat.id));
        container.appendChild(btn);
      });

      requestAnimationFrame(() => moveCategoryIndicator());
    }

    function moveCategoryIndicator() {
      const container = document.getElementById("categoryScroll");
      const indicator = document.getElementById("categoryIndicator");
      const activeBtn = container.querySelector(`.cat-chip[data-cat="${state.activeCategory}"]`);
      if (!activeBtn || !indicator) return;
      indicator.style.width = `${activeBtn.offsetWidth}px`;
      indicator.style.transform = `translate3d(${activeBtn.offsetLeft}px, 0, 0)`;
    }

    function selectCategory(catId) {
      if (state.activeCategory === catId) return;
      state.activeCategory = catId;
      document.querySelectorAll(".cat-chip").forEach((c) => {
        c.classList.toggle("active", c.dataset.cat === catId);
      });
      moveCategoryIndicator();
      const activeBtn = document.querySelector(`.cat-chip[data-cat="${catId}"]`);
      if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      renderFoodGrid(true);
    }

    function renderFoodGrid(flipEffect = false) {
      const grid = document.getElementById("foodGrid");
      const titleEl = document.getElementById("menuSectionTitle");
      const countEl = document.getElementById("menuSectionCount");

      const items =
        state.activeCategory === "Semua"
          ? PRODUCTS
          : PRODUCTS.filter((p) => p.category === state.activeCategory);

      titleEl.textContent = state.activeCategory === "Semua" ? "Menu Populer" : `Menu ${state.activeCategory}`;
      countEl.textContent = `${items.length} menu`;

      if (flipEffect && !prefersReducedMotion()) {
        grid.classList.remove("grid-flipping");
        void grid.offsetWidth;
        grid.classList.add("grid-flipping");
      }

      grid.innerHTML = items
        .map((p, index) => {
          const isFav = state.favorites.includes(p.id);
          const delay = !state.homeAnimatedOnce ? index * 45 : 0;
          return `
            <article class="food-card ${!state.homeAnimatedOnce ? "stagger-in" : ""}" data-id="${p.id}" style="transition-delay:${delay}ms">
              <button class="card-fav-btn ${isFav ? "liked" : ""}" data-fav-id="${p.id}" aria-label="Favoritkan ${p.name}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </button>
              <div class="card-img-stage">
                <div class="skeleton-box"></div>
                <div class="food-img-wrap">
                  <img class="food-img-float" src="${p.image}" alt="${p.name}" loading="lazy" style="animation-delay:${(index % 4) * -0.9}s" />
                </div>
              </div>
              <div>
                <h3 class="card-name">${p.name}</h3>
                <div class="card-weight">${p.weight} • ${p.category}</div>
                <div class="card-footer">
                  <span class="card-price">${formatRp(p.price)}</span>
                  <button class="card-add-btn" data-quick-add="${p.id}" aria-label="Tambah ${p.name} ke keranjang">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                      <line x1="12" y1="5" x2="12" y2="19" />
                      <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                  </button>
                </div>
              </div>
            </article>
          `;
        })
        .join("");

      // Skeleton load & fallback handling + 3D tilt + handlers
      grid.querySelectorAll(".food-card").forEach((card) => {
        const id = card.dataset.id;
        const img = card.querySelector(".food-img-float");
        const skel = card.querySelector(".skeleton-box");
        const wrap = card.querySelector(".food-img-wrap");

        const finishLoad = () => {
          img.classList.add("loaded");
          if (skel) skel.classList.add("hidden");
        };
        if (img.complete && img.naturalWidth > 0) finishLoad();
        img.addEventListener("load", finishLoad);
        img.addEventListener("error", () => {
          img.src = createFoodFallbackSvg(getProduct(id));
          finishLoad();
        });

        // 3D Tilt mengikuti kursor / sentuhan
        if (!prefersReducedMotion()) {
          const applyTilt = (clientX, clientY) => {
            const r = card.getBoundingClientRect();
            const nx = ((clientX - r.left) / r.width - 0.5) * 2;
            const ny = ((clientY - r.top) / r.height - 0.5) * 2;
            wrap.style.transform = `perspective(500px) rotateY(${nx * 8}deg) rotateX(${-ny * 8}deg) scale(1.04)`;
          };
          const resetTilt = () => (wrap.style.transform = "");
          card.addEventListener("pointermove", (e) => applyTilt(e.clientX, e.clientY));
          card.addEventListener("pointerleave", resetTilt);
          card.addEventListener("touchend", resetTilt);
        }

        card.addEventListener("click", (e) => {
          if (e.target.closest("[data-fav-id]") || e.target.closest("[data-quick-add]")) return;
          Anim.openProductWithSharedTransition(id, card);
        });
      });

      grid.querySelectorAll("[data-fav-id]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(btn.dataset.favId, btn);
        });
      });

      grid.querySelectorAll("[data-quick-add]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const p = getProduct(btn.dataset.quickAdd);
          addToCart(p.id, 1, []);
          Anim.flyToCart(btn, p.image);
          Anim.showToast(`${p.name} masuk keranjang`);
        });
      });

      if (!state.homeAnimatedOnce) {
        requestAnimationFrame(() => {
          grid.querySelectorAll(".stagger-in").forEach((c) => {
            c.classList.add("stagger-shown");
          });
        });
        state.homeAnimatedOnce = true;
      }
    }

    function createFoodFallbackSvg(product) {
      const label = encodeURIComponent(product ? product.category : "Bite");
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="260" viewBox="0 0 300 260"><rect width="300" height="260" fill="%23FFF4E0"/><circle cx="150" cy="120" r="70" fill="%239B0A0A"/><text x="150" y="130" text-anchor="middle" fill="%23FFB21A" font-family="sans-serif" font-weight="800" font-size="24">${label}</text></svg>`;
    }

    function toggleFavorite(productId, btnEl) {
      const idx = state.favorites.indexOf(productId);
      const adding = idx === -1;
      if (adding) {
        state.favorites.push(productId);
        if (btnEl) {
          btnEl.classList.add("liked", "pop");
          const svg = btnEl.querySelector("svg");
          if (svg) svg.setAttribute("fill", "currentColor");
          Anim.heartParticleBurst(btnEl);
          setTimeout(() => btnEl.classList.remove("pop"), 450);
        }
        Anim.bounceBadge(document.getElementById("favBadge"));
      } else {
        state.favorites.splice(idx, 1);
        if (btnEl) {
          btnEl.classList.remove("liked");
          const svg = btnEl.querySelector("svg");
          if (svg) svg.setAttribute("fill", "none");
        }
      }
      saveFavorites();
      if (state.route === "home") {
        // Sinkron jika dipicu dari tempat lain
      }
    }

    function addToCart(productId, qty, selectedAddons) {
      const normalized = (selectedAddons || [])
        .filter((a) => a.qty > 0)
        .sort((a, b) => a.id.localeCompare(b.id));
      const key = `${productId}__${normalized.map((a) => `${a.id}:${a.qty}`).join(",")}`;

      const existing = state.cart.find((c) => c.key === key);
      if (existing) {
        existing.qty += qty;
      } else {
        state.cart.push({
          key,
          productId,
          qty,
          addons: normalized
        });
      }
      saveCart();
    }

    function updateNavBadges() {
      const cartCount = getCartCount();
      const favCount = state.favorites.length;
      const cartBadge = document.getElementById("cartBadge");
      const favBadge = document.getElementById("favBadge");

      cartBadge.textContent = cartCount > 99 ? "99+" : String(cartCount);
      cartBadge.classList.toggle("empty", cartCount === 0);

      favBadge.textContent = favCount > 99 ? "99+" : String(favCount);
      favBadge.classList.toggle("empty", favCount === 0);
    }

    function updateBottomNavPill(tabName) {
      const index = TAB_ORDER.indexOf(tabName);
      if (index === -1) return;
      const pill = document.getElementById("navActivePill");
      pill.style.transform = `translate3d(${index * 100}%, 0, 0)`;
      document.querySelectorAll(".nav-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.tab === tabName);
      });
    }

    /* --- Render 3. Detail Produk --- */

      const screen = document.getElementById("screen-detail");
      const p = getProduct(state.selectedProductId);
      if (!p) return;
      const isFav = state.favorites.includes(p.id);

      const calcUnitTotal = () => {
        const addonSum = p.addons.reduce((sum, a) => sum + (state.detailAddons[a.id] || 0) * a.price, 0);
        return (p.price + addonSum) * state.detailQty;
      };

        <div class="sub-topbar transparent">
          <button class="icon-btn" id="detailBackBtn" aria-label="Kembali">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2.2">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>

        <div class="detail-hero">
          <div class="detail-red-circle"></div>
          <div class="detail-photo-frame">
            <img src="${p.image}" alt="${p.name}" onerror="this.src='${createFoodFallbackSvg(p)}'" />
          </div>
        </div>

        <div class="detail-body">
          <div class="detail-head">
            <div>
              <h1 class="detail-name">${p.name}</h1>
              <span class="detail-weight">${p.weight} • ${p.category}</span>
            </div>
            <div class="detail-price">${formatRp(p.price)}</div>
          </div>

          <div class="detail-section-label">Bahan-bahan</div>
          <div class="ingredients-list">
            ${p.ingredients.map((ing) => `<span class="ingredient-tag">${ing}</span>`).join("")}
          </div>

          <div class="detail-section-label">Tambahan (Add-on)</div>
          <div class="addon-list">
            ${p.addons
              .map(
                (a) => `
                <div class="addon-row">
                  <div>
                    <div class="addon-name">${a.name}</div>
                    <div class="addon-price">+ ${formatRp(a.price)}</div>
                  </div>
                  <div class="stepper">
                    <button class="step-btn" data-addon-dec="${a.id}" aria-label="Kurangi ${a.name}">−</button>
                    <span class="step-val" id="addonVal-${a.id}">${state.detailAddons[a.id] || 0}</span>
                    <button class="step-btn plus" data-addon-inc="${a.id}" aria-label="Tambah ${a.name}">+</button>
                  </div>
                </div>
              `
              )
              .join("")}
          </div>
        </div>

        <div class="detail-bottom-bar">
          <div class="stepper" style="padding:6px;background:var(--color-input);box-shadow:none;">
            <button class="step-btn" id="detailQtyDec" style="background:var(--color-white);" aria-label="Kurangi jumlah">−</button>
            <span class="step-val" id="detailQtyVal" style="min-width:24px;">${state.detailQty}</span>
            <button class="step-btn plus" id="detailQtyInc" aria-label="Tambah jumlah">+</button>
          </div>
          <button class="btn-primary" id="btnAddDetailToCart" style="flex:1;">
            Ke keranjang – <span id="detailBtnTotal">${formatRp(calcUnitTotal())}</span>
          </button>
        </div>
      `;

      const refreshPrices = () => {
        document.getElementById("detailQtyVal").textContent = state.detailQty;
        document.getElementById("detailBtnTotal").textContent = formatRp(calcUnitTotal());
        p.addons.forEach((a) => {
          document.getElementById(`addonVal-${a.id}`).textContent = state.detailAddons[a.id] || 0;
        });
      };

      document.getElementById("detailBackBtn").addEventListener("click", goBack);

      document.getElementById("detailFavBtn").addEventListener("click", (e) => {
        const btn = e.currentTarget;
        toggleFavorite(p.id, btn);
        const likedNow = state.favorites.includes(p.id);
        btn.style.color = likedNow ? "var(--color-primary)" : "var(--color-text)";
      });

      p.addons.forEach((a) => {
        screen.querySelector(`[data-addon-inc="${a.id}"]`).addEventListener("click", () => {
          state.detailAddons[a.id] = Math.min(5, (state.detailAddons[a.id] || 0) + 1);
          refreshPrices();
        });
        screen.querySelector(`[data-addon-dec="${a.id}"]`).addEventListener("click", () => {
          state.detailAddons[a.id] = Math.max(0, (state.detailAddons[a.id] || 0) - 1);
          refreshPrices();
        });
      });

      document.getElementById("detailQtyInc").addEventListener("click", () => {
        state.detailQty = Math.min(20, state.detailQty + 1);
        refreshPrices();
      });

      document.getElementById("detailQtyDec").addEventListener("click", () => {
        state.detailQty = Math.max(1, state.detailQty - 1);
        refreshPrices();
      });

      document.getElementById("btnAddDetailToCart").addEventListener("click", () => {
        const selectedAddons = p.addons
          .filter((a) => (state.detailAddons[a.id] || 0) > 0)
          .map((a) => ({ id: a.id, name: a.name, price: a.price, qty: state.detailAddons[a.id] }));
        addToCart(p.id, state.detailQty, selectedAddons);

        goBack();
        requestAnimationFrame(() => Anim.bounceBadge(document.getElementById("cartBadge")));
      });
    }

    /* --- Render 4. Keranjang --- */

      screen.innerHTML = `

        </div>
        <div class="list-stack">
